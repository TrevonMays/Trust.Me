{% extends "base.html" %}

{% block content %}

<div class="min-h-screen bg-slate-100 px-6 py-10">

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">

        <div class="mb-8">

            <h2 class="text-3xl font-bold text-slate-800">
                Edit Patient
            </h2>

            <p class="text-slate-500 mt-2">
                Update patient demographic and medical information.
            </p>

        </div>

        <form method="POST" class="space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        value="{{ patient.first_name }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>

                <div>

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        value="{{ patient.last_name }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Date of Birth
                    </label>

                    <input
                        type="text"
                        name="date_of_birth"
                        value="{{ patient.date_of_birth }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>

                <div>

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Gender
                    </label>

                    <select
                        name="gender"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option
                            value="Male"
                            {% if patient.gender == "Male" %}selected{% endif %}
                        >
                            Male
                        </option>

                        <option
                            value="Female"
                            {% if patient.gender == "Female" %}selected{% endif %}
                        >
                            Female
                        </option>

                    </select>

                </div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ patient.phone }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>

                <div>

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email_address"
                        value="{{ patient.email_address }}"
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>

            </div>

            <div>

                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Allergies
                </label>

                <textarea
                    name="allergies"
                    rows="3"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >{{ patient.allergies }}</textarea>

            </div>

            <div>

                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Medications
                </label>

                <textarea
                    name="medications"
                    rows="3"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >{{ patient.medications }}</textarea>

            </div>

            <div>

                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Medical History
                </label>

                <textarea
                    name="medical_history"
                    rows="4"
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >{{ patient.medical_history }}</textarea>

            </div>

            <div class="flex items-center gap-4 pt-4">

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition"
                >
                    Update Patient
                </button>

                <a
                    href="/"
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-6 py-3 rounded-lg transition"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
